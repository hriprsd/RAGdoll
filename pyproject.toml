[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragdoll"
version = "0.1.0"
description = "Local RAG memory for your dev tools — cross-project, offline, yours."
license = {text = "MIT"}
authors = [{name = "hriprsd"}]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["rag", "search", "embeddings", "code-search", "local", "sqlite", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "sqlite-vec>=0.1.0",
    "fastembed>=0.4",
    "httpx>=0.27",
    "watchdog>=4.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "mcp>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
ragdoll = "ragdoll.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
